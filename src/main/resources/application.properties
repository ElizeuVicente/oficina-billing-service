spring.application.name=oficina-billing-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${BILLING_DB_URL:jdbc:postgresql://localhost:5433/billing}
spring.datasource.username=${BILLING_DB_USER:billing}
spring.datasource.password=${BILLING_DB_PASSWORD:billing-local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
billing.outbox.enabled=${BILLING_OUTBOX_ENABLED:false}
billing.commands.enabled=${BILLING_COMMANDS_ENABLED:false}
billing.service-token=${BILLING_SERVICE_TOKEN}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
